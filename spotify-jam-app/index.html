<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Jam - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="home">
<nav id="sidebar">
  <div class="sidebar-logo"><span>♫</span><span class="logo-text">Spotify Jam</span></div>

  <div class="nav-section">
    <div class="nav-label">Browse</div>
    <a class="nav-item active" href="index.html"><span class="nav-icon">⌂</span><span class="nav-text">Home</span></a>
    <a class="nav-item " href="pages/search.html"><span class="nav-icon">⊙</span><span class="nav-text">Search</span></a>
    <a class="nav-item " href="pages/library.html"><span class="nav-icon">☰</span><span class="nav-text">Library</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-label">Jam</div>
    <a class="nav-item " href="pages/jam.html"><span class="nav-icon">✦</span><span class="nav-text">Jam Session</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-label">Group Modes</div>
    <a class="nav-item " href="pages/voting.html"><span class="nav-icon">◉</span><span class="nav-text">Voting Selection</span></a>
    <a class="nav-item " href="pages/turnbased.html"><span class="nav-icon">↻</span><span class="nav-text">Turn-Based</span></a>
    <a class="nav-item " href="pages/skipvote.html"><span class="nav-icon">»</span><span class="nav-text">Skip Voting</span></a>
  </div>
</nav>
<main id="main">
<div class="page" id="page-home">
  <div class="page-header">
    <div class="page-title" id="greeting">Good evening</div>
    <div class="page-sub">What do you want to listen to?</div>
  </div>
  <div class="section">
    <div class="section-title">Recently Played</div>
    <div class="card-grid" id="featured-cards"></div>
  </div>
  <div class="section">
    <div class="section-title">All Songs</div>
    <div class="song-list" id="home-song-list"></div>
  </div>
</div>
</main>
<div id="player">
  <div class="player-song">
    <div class="player-title" id="now-title">No song playing</div>
    <div class="player-artist" id="now-artist">—</div>
  </div>
  <div class="player-controls">
    <div class="ctrl-btns">
      <button class="ctrl-btn" title="Previous">⏮</button>
      <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" title="Next" onclick="nextTrack()">⏭</button>
    </div>
    <div class="progress-row">
      <span class="time-lbl" id="elapsed">0:00</span>
      <div class="progress-bar-wrap" onclick="seekTo(event)">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
      </div>
      <span class="time-lbl" id="duration">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <div class="jam-badge" id="jam-badge">
      <div class="jam-dot"></div>
      <span id="jam-badge-text"></span>
    </div>
    <div class="vol-row">🔊 <input type="range" min="0" max="100" value="70" id="vol-slider"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="js/main.js"></script>
</body>
</html>
