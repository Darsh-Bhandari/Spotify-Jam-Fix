<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Jam - Skip Voting</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="skipvote">
<nav id="sidebar">
  <div class="sidebar-logo"><span>♫</span><span class="logo-text">Spotify Jam</span></div>

  <div class="nav-section">
    <div class="nav-label">Browse</div>
    <a class="nav-item " href="../index.html"><span class="nav-icon">⌂</span><span class="nav-text">Home</span></a>
    <a class="nav-item " href="search.html"><span class="nav-icon">⊙</span><span class="nav-text">Search</span></a>
    <a class="nav-item " href="library.html"><span class="nav-icon">☰</span><span class="nav-text">Library</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-label">Jam</div>
    <a class="nav-item " href="jam.html"><span class="nav-icon">✦</span><span class="nav-text">Jam Session</span></a>
  </div>

  <div class="nav-section">
    <div class="nav-label">Group Modes</div>
    <a class="nav-item " href="voting.html"><span class="nav-icon">◉</span><span class="nav-text">Voting Selection</span></a>
    <a class="nav-item " href="turnbased.html"><span class="nav-icon">↻</span><span class="nav-text">Turn-Based</span></a>
    <a class="nav-item active" href="skipvote.html"><span class="nav-icon">»</span><span class="nav-text">Skip Voting</span></a>
  </div>
</nav>
<main id="main">
<div class="page" id="page-skipvote">
  <div class="skip-banner">
    <div class="page-title" style="color:var(--red)">» Skip Voting System</div>
    <div class="page-sub">Vote as a group to skip · automatic skip at threshold</div>
  </div>
  <div class="two-col" style="align-items:start">
    <div>
      <div class="now-playing-card">
        <div class="np-art" id="skip-art" style="background:#1db954">♪</div>
        <div class="np-title" id="skip-title">Select a song</div>
        <div class="np-artist" id="skip-artist">—</div>
      </div>
      <div class="skip-meter-wrap">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px">
          <div class="skip-count"><span id="skip-votes">0</span> <span>/ <span id="skip-threshold">3</span> votes to skip</span></div>
        </div>
        <div class="skip-meter-bar"><div class="skip-meter-fill" id="skip-fill" style="width:0%"></div></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn btn-red" id="skip-btn" onclick="castSkipVote()">⏭ Vote to Skip</button>
        <button class="btn btn-dark btn-sm" onclick="simulateGroupVote()">Simulate Group</button>
      </div>
    </div>
    <div>
      <div class="section-title" style="margin-bottom:12px">Listeners</div>
      <div id="skip-listener-list"></div>
      <div class="section-title" style="margin-top:24px;margin-bottom:12px">How It Works</div>
      <div id="skip-rules"></div>
    </div>
  </div>
</div>
</main>
<div id="player">
  <div class="player-song">
    <div class="player-title" id="now-title">No song playing</div>
    <div class="player-artist" id="now-artist">—</div>
  </div>
  <div class="player-controls">
    <div class="ctrl-btns">
      <button class="ctrl-btn" title="Previous">⏮</button>
      <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" title="Next" onclick="nextTrack()">⏭</button>
    </div>
    <div class="progress-row">
      <span class="time-lbl" id="elapsed">0:00</span>
      <div class="progress-bar-wrap" onclick="seekTo(event)">
        <div class="progress-fill" id="prog-fill" style="width:0%"></div>
      </div>
      <span class="time-lbl" id="duration">0:00</span>
    </div>
  </div>
  <div class="player-right">
    <div class="jam-badge" id="jam-badge">
      <div class="jam-dot"></div>
      <span id="jam-badge-text"></span>
    </div>
    <div class="vol-row">🔊 <input type="range" min="0" max="100" value="70" id="vol-slider"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="../js/main.js"></script>
</body>
</html>
